
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <header>
            <h1>My To-Do List</h1>
            <p>Plan your day, one task at a time ✨</p>
        </header>

        <form id="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
                autocomplete="off"
                required
            >
            <button type="submit" id="add-btn">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>

        <div class="filters" aria-label="Filter tasks">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task! 🌸</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
